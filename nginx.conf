limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=invites_zone:10m rate=20r/m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name h8labeling.com www.h8labeling.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name h8labeling.com www.h8labeling.com;

    ssl_certificate /etc/letsencrypt/live/h8labeling.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h8labeling.com/privkey.pem;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Auth endpoints - rate limited to blunt brute-force/spam
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Invite endpoints - rate limited to blunt brute-force/spam
    location /api/invites/ {
        limit_req zone=invites_zone burst=10 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2G;
    }
}
